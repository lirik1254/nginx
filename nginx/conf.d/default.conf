# Бэкенд (API) и фронт — по именам сервисов из их docker-compose.
# В общей Docker-сети nginx обращается к контейнерам по имени сервиса.
upstream backend {
    server app:8080;          # сервис "app" из testProj (Spring, порт 8080)
}

upstream frontend {
    server frontend:4173;     # сервис "frontend" из template-frontend (Vite preview, 4173)
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # --- API -> бэкенд ---
    # Путь передаётся как есть: /api/test -> бэк получает /api/test.
    # /api у Spring это context-path (application.yaml), срезать нельзя.
    location /api/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --- Всё остальное -> фронт ---
    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (на случай, если фронт их использует)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
